# Debug build: USB CDC serial logging
# config/scanner_pocket.conf sets CONFIG_LOG=n, so re-enable it explicitly
# (ZMK_USB_LOGGING also `select LOG`, this just avoids a Kconfig conflict).
CONFIG_LOG=y

# Keep DEFERRED mode (the default): ZMK sets
# LOG_PROCESS_THREAD_STARTUP_DELAY_MS=1000 so the boot log is buffered until
# USB CDC has enumerated. IMMEDIATE mode would throw those early lines away.
# Make the buffer big enough to hold the whole boot sequence.
CONFIG_LOG_BUFFER_SIZE=8192

# Verbose: we want to see how far boot gets
CONFIG_LOG_DEFAULT_LEVEL=4
CONFIG_ZMK_LOG_LEVEL_DBG=y

# Keep the banner - it is the proof the MCU is running at all
CONFIG_BOOT_BANNER=y
CONFIG_PRINTK=y
